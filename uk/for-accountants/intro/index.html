<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/assets/taxready-badge.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/taxready-32.png">
<link rel="apple-touch-icon" href="/assets/taxready-180.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaxReady — As featured in XU Magazine</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  /* ───────────────────────────────────────────────────────────────
     ENDCARD — closing frame of the video demo. ~15s on screen.

     Stack (top → bottom, vertically centred on page):
       1. TaxReady wordmark (small)
       2. CTA block: "Visit" + big "TaxReady.uk" gradient
       3. *generous gap separating CTA from press tag*
       4. White press quote with pink outlined quote marks
       5. "AS FEATURED IN" eyebrow + XU Magazine logo (bigger)

     The CTA is the centre of the experience and gets extra life:
       - the gradient breathes pink↔purple
       - the whole title scale-breathes 1 ↔ 1.02
       - the halo (drop-shadow) pulses brighter/dimmer
   ───────────────────────────────────────────────────────────── */

  :root {
    --bg: #0a0a12;
    --pink: #E77481;
    --magenta: #9B3FC7;
    --grad: linear-gradient(90deg,#E77481 0%,#d946ef 35%,#9B3FC7 70%,#E77481 100%);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--bg);
    color: #fff;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* ── Ambient drifting corner glows ────────────────────────────── */
  body::before, body::after {
    content: '';
    position: fixed;
    width: 70vmax;
    height: 70vmax;
    border-radius: 50%;
    filter: blur(80px);
    opacity: .22;
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    background: radial-gradient(circle, var(--pink) 0%, transparent 60%);
    top: -35vmax; left: -25vmax;
    animation: drift1 22s ease-in-out infinite;
  }
  body::after {
    background: radial-gradient(circle, var(--magenta) 0%, transparent 60%);
    bottom: -35vmax; right: -25vmax;
    animation: drift2 26s ease-in-out infinite;
  }
  @keyframes drift1 {
    0%,100% { transform: translate(0,0) scale(1); }
    50%     { transform: translate(12vmax,8vmax) scale(1.08); }
  }
  @keyframes drift2 {
    0%,100% { transform: translate(0,0) scale(1); }
    50%     { transform: translate(-10vmax,-8vmax) scale(1.06); }
  }

  /* ── Page layout — vertically centred, flex column ───────────── */
  .endcard {
    position: relative; z-index: 5;
    min-height: 100svh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: clamp(28px, 4svh, 56px) clamp(20px, 4vw, 56px);
    text-align: center;
    gap: clamp(14px, 2.2svh, 26px);
  }

  /* ── TaxReady wordmark — top of stack, static + bigger ───────── */
  .endcard-logo {
    display: inline-flex;
    text-decoration: none;
    opacity: 0;
    animation: fadeUp .7s cubic-bezier(.2,.8,.3,1) .2s forwards;
  }
  .endcard-logo img {
    height: clamp(38px, 4vw, 56px);
    width: auto; display: block;
    filter: brightness(0) invert(1);
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

/* The big gradient brand URL — single h1: "Visit TaxReady.uk".
     Clean pink↔purple gradient (no white peak — that was reading
     as a green tint where it blended into the deep purple). Idle
     animations: gradient flows continuously + halo pulses. */
  .endcard-title {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 600;
    font-size: clamp(40px, 9vw, 132px);
    line-height: 1.05;
    letter-spacing: -.022em;
    text-wrap: balance;
    background: linear-gradient(
      100deg,
      #E77481  0%,
      #d946ef 22%,
      #9B3FC7 44%,
      #d946ef 66%,
      #E77481 100%
    );
    background-size: 240% 100%;
    background-position: 0% 50%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    /* Generous horizontal + bottom padding so italic ascenders/
       descenders ("y", "T") don't get clipped by the text bounding
       box that background-clip:text uses. */
    padding: 0 .12em 22px;
    will-change: filter, background-position;
    opacity: 0;
    animation:
      titleIn   1s   cubic-bezier(.2,.8,.3,1) .55s forwards,
      gradFlow  9s   linear 1.6s infinite,
      titleGlow 4.5s ease-in-out 2.2s infinite;
    user-select: none;
  }
  @keyframes titleIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes gradFlow {
    0%   { background-position:   0% 50%; }
    100% { background-position: 100% 50%; }
  }
  @keyframes titleGlow {
    0%,100% {
      filter:
        drop-shadow(0 0 22px rgba(231,116,129,.30))
        drop-shadow(0 0 48px rgba(155,63,199,.18));
    }
    50% {
      filter:
        drop-shadow(0 0 32px rgba(231,116,129,.46))
        drop-shadow(0 0 80px rgba(155,63,199,.32))
        drop-shadow(0 0 140px rgba(231,116,129,.12));
    }
  }

  /* ── PRESS BLOCK — clearly spaced from the CTA above ────────── */
  .endcard-press {
    display: flex; flex-direction: column; align-items: center;
    gap: clamp(18px, 3svh, 32px);
    /* Generous separation from the URL block above so the press tag
       reads as a distinct closing credit, not a sub-line of the CTA. */
    margin-top: clamp(28px, 6svh, 72px);
  }

  /* The press quote — bigger than before, white, with big outlined
     pink quote marks for brand color accent. */
  .endcard-quote-wrap {
    position: relative;
    padding: 0 12px;
    max-width: 1100px;
    opacity: 0;
    animation: fadeUp 1s cubic-bezier(.2,.8,.3,1) 1.6s forwards;
  }
  .endcard-quote {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(28px, 4.6vw, 60px);
    line-height: 1.15;
    letter-spacing: -.014em;
    text-wrap: balance;
    color: #fff;
    padding-bottom: 4px;
  }
  /* "at no cost" — brand-green CTA highlight inside the quote.
     white-space:nowrap keeps the phrase on one line so it never
     splits across a break. Subtle glow + pulsing for life. */
  .endcard-quote-highlight {
    color: #4ade80;
    font-weight: 600;
    white-space: nowrap;
    text-shadow:
      0 0 14px rgba(34,197,94,.45),
      0 0 30px rgba(34,197,94,.25);
    animation: highlightPulse 3.4s ease-in-out 3.6s infinite;
  }
  @keyframes highlightPulse {
    0%,100% {
      text-shadow:
        0 0 14px rgba(34,197,94,.45),
        0 0 30px rgba(34,197,94,.25);
    }
    50% {
      text-shadow:
        0 0 20px rgba(34,197,94,.7),
        0 0 50px rgba(34,197,94,.35);
    }
  }
  /* Big outlined quote marks removed — using inline curly quotes
     inside the paragraph text now (see markup). */

  /* Press-credit — "AS FEATURED IN" + XU logo, sits beneath quote */
  .endcard-press-credit {
    display: flex; flex-direction: column; align-items: center;
    gap: clamp(12px, 1.8svh, 18px);
    opacity: 0;
    animation: fadeUp .8s cubic-bezier(.2,.8,.3,1) 2.4s forwards;
  }
  .endcard-press-eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: clamp(10px, 1vw, 12px);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .28em;
    color: rgba(255,255,255,.5);
    display: inline-flex; align-items: center; gap: 12px;
    animation: pressEyebrowFade 4s ease-in-out 4s infinite;
  }
  .endcard-press-eyebrow::before, .endcard-press-eyebrow::after {
    content: ''; width: 28px; height: 1px; background: rgba(255,255,255,.22);
  }
  @keyframes pressEyebrowFade {
    0%,100% { color: rgba(255,255,255,.5); }
    50%     { color: rgba(255,255,255,.78); }
  }
  .endcard-xu {
    display: inline-flex;
    text-decoration: none;
    padding: 4px;
    animation: xuFloat 6s ease-in-out 3.5s infinite;
  }
  .endcard-xu img {
    /* Bigger than before per request — was clamp(56,7vw,96), now
       clamp(80, 10vw, 140) so it reads as a real press credit. */
    height: clamp(80px, 10vw, 140px);
    width: auto; display: block;
  }
  @keyframes xuFloat {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-3px); }
  }
  @media (max-width: 700px) {
    .endcard-press-eyebrow::before, .endcard-press-eyebrow::after { width: 20px; }
  }

  /* ── Reduced motion — keep the look, kill the choreography. */
  @media (prefers-reduced-motion: reduce) {
    body::before, body::after,
    .endcard-logo, .endcard-cta-eyebrow, .endcard-title,
    .endcard-quote-wrap, .endcard-quote-wrap::before, .endcard-quote-wrap::after,
    .endcard-press-credit, .endcard-press-eyebrow, .endcard-xu {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }
  }
</style>
</head>

<body>

<main class="endcard">

  <!-- TaxReady wordmark — small, top -->
  <a class="endcard-logo" href="/uk/" aria-label="TaxReady home">
    <img src="/assets/taxready.svg" alt="TaxReady">
  </a>

  <!-- The CTA — single big gradient line. -->
  <h1 class="endcard-title">Visit TaxReady.uk</h1>

  <!-- Clearly separated press block: quote + XU credit -->
  <section class="endcard-press" aria-label="Press">

    <div class="endcard-quote-wrap">
      <p class="endcard-quote">&ldquo;Warm, pre-qualified enquiries, <span class="endcard-quote-highlight">at no cost,</span> matched exclusively to your firm.&rdquo;</p>
    </div>

    <div class="endcard-press-credit">
      <span class="endcard-press-eyebrow">As featured in</span>
      <a class="endcard-xu"
         href="https://xumagazine.com/news/56-million-taxpayers-overpaid-hmrc-last-year-a-new-free-tool-wants-to-send-them-straight-to-your-door"
         target="_blank" rel="noopener"
         aria-label="XU Magazine">
        <img src="/assets/xu-magazine-logo.webp" alt="XU Magazine">
      </a>
    </div>

  </section>

</main>

  <script src="/js/workiro-wordmark.js" defer></script>
</body>
</html>
