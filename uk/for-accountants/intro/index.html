<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="/assets/taxready-badge.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/taxready-32.png">
<link rel="apple-touch-icon" href="/assets/taxready-180.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaxReady — As featured in XU Magazine</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=IBM+Plex+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #0a0a12;
    --pink: #E77481;
    --magenta: #9B3FC7;
    --grad-hero: linear-gradient(90deg,#E77481 0%,#d946ef 35%,#9B3FC7 70%,#E77481 100%);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--bg);
    color: #fff;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ── Ambient drifting glows for depth ──────────────────────────── */
  body::before, body::after {
    content: '';
    position: fixed;
    width: 70vmax;
    height: 70vmax;
    border-radius: 50%;
    filter: blur(80px);
    opacity: .25;
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    background: radial-gradient(circle, var(--pink) 0%, transparent 60%);
    top: -35vmax; left: -25vmax;
    animation: drift1 22s ease-in-out infinite;
  }
  body::after {
    background: radial-gradient(circle, var(--magenta) 0%, transparent 60%);
    bottom: -35vmax; right: -25vmax;
    animation: drift2 26s ease-in-out infinite;
  }
  @keyframes drift1 {
    0%,100% { transform: translate(0,0) scale(1); }
    50%     { transform: translate(12vmax,8vmax) scale(1.08); }
  }
  @keyframes drift2 {
    0%,100% { transform: translate(0,0) scale(1); }
    50%     { transform: translate(-10vmax,-8vmax) scale(1.06); }
  }

  /* ── Minimal demo-friendly nav ────────────────────────────────── */
  .intro-nav {
    position: relative; z-index: 10;
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 40px;
  }
  .intro-nav-logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
  .intro-nav-logo img { height: 28px; width: auto; display: block; filter: brightness(0) invert(1); }
  .intro-nav-cta {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13.5px; font-weight: 600;
    color: #fff; text-decoration: none;
    padding: 9px 18px; border-radius: 100px;
    border: 1.5px solid rgba(255,255,255,.22);
    transition: background .18s ease, border-color .18s ease;
  }
  .intro-nav-cta:hover { background: rgba(255,255,255,.08); border-color: rgba(255,255,255,.45); }
  @media (max-width: 600px) {
    .intro-nav { padding: 18px 22px; }
    .intro-nav-logo img { height: 24px; }
    .intro-nav-cta { font-size: 12.5px; padding: 8px 14px; }
  }

  /* ── HERO ─────────────────────────────────────────────────────── */
  .intro-hero {
    position: relative; z-index: 5;
    min-height: calc(100svh - 84px);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 32px 80px;
    text-align: center;
    gap: 38px;
  }
  @media (max-width: 700px) {
    .intro-hero { padding: 28px 22px 64px; gap: 28px; min-height: calc(100svh - 70px); }
  }

  /* "As featured in" eyebrow + XU logo block — staggered fade-up on load */
  .intro-press {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    opacity: 0; transform: translateY(12px);
    animation: heroIn .8s cubic-bezier(.2,.8,.3,1) .25s forwards;
  }
  .intro-eyebrow {
    font-family: 'DM Mono', monospace;
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .26em;
    color: rgba(255,255,255,.55);
    display: inline-flex; align-items: center; gap: 12px;
  }
  .intro-eyebrow::before, .intro-eyebrow::after {
    content: ''; width: 28px; height: 1px; background: rgba(255,255,255,.2);
  }
  /* XU Magazine logo — designed for dark backgrounds, so no white
     card needed. Sits directly on the hero bg with a small hover
     lift for interactivity. */
  .intro-xu-logo {
    display: inline-flex; align-items: center; justify-content: center;
    text-decoration: none;
    padding: 4px;
    transition: transform .25s ease, opacity .25s ease;
  }
  .intro-xu-logo:hover { transform: translateY(-2px); opacity: .85; }
  .intro-xu-logo img { height: 72px; width: auto; display: block; }
  @media (max-width: 700px) {
    .intro-xu-logo img { height: 54px; }
    .intro-eyebrow { font-size: 9.5px; letter-spacing: .22em; }
    .intro-eyebrow::before, .intro-eyebrow::after { width: 20px; }
  }

  /* ── THE QUOTE — animated gradient italic. Lazy-shift across the
       gradient so it breathes pink → purple → pink. Big Playfair
       italic so it carries the visual weight on its own. ────────── */
  .intro-quote {
    position: relative;
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(34px, 6.2vw, 80px);
    line-height: 1.1;
    letter-spacing: -.018em;
    max-width: 1080px;
    text-wrap: balance;
    /* Animated 4-stop gradient as the text fill. background-size 200%
       lets the gradient-shift keyframe slide its position end-to-end
       so colours appear to flow across the words. */
    background: var(--grad-hero);
    background-size: 200% 100%;
    background-position: 0% 50%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    animation: gradShift 9s ease-in-out infinite, heroQuoteIn .9s cubic-bezier(.2,.8,.3,1) .5s backwards;
    padding-bottom: 12px;
  }
  /* Large outlined quote marks before/after for editorial polish. The
     wrapper carries them as ::before/::after so they sit visually
     attached to the quote without taking up flow. */
  .intro-quote-wrap {
    position: relative;
    padding: 0 8px;
    opacity: 0; transform: translateY(20px);
    animation: heroIn 1s cubic-bezier(.2,.8,.3,1) .35s forwards;
  }
  .intro-quote-wrap::before,
  .intro-quote-wrap::after {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 700;
    line-height: .6;
    color: rgba(231,116,129,.32);
    position: absolute;
    user-select: none;
    pointer-events: none;
  }
  .intro-quote-wrap::before {
    content: '\201C';
    top: -.2em; left: -.08em;
    font-size: clamp(80px, 14vw, 200px);
  }
  .intro-quote-wrap::after {
    content: '\201D';
    bottom: -.4em; right: -.05em;
    font-size: clamp(80px, 14vw, 200px);
  }
  @keyframes gradShift {
    0%   { background-position:   0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position:   0% 50%; }
  }
  @keyframes heroQuoteIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes heroIn { to { opacity: 1; transform: none; } }

  /* ── Attribution + article link ───────────────────────────────── */
  .intro-attrib {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 16px;
    color: rgba(255,255,255,.6);
    display: inline-flex; align-items: center; gap: 14px;
    flex-wrap: wrap;
    justify-content: center;
    opacity: 0; transform: translateY(12px);
    animation: heroIn .8s cubic-bezier(.2,.8,.3,1) 1s forwards;
  }
  .intro-attrib a {
    color: #fff; font-weight: 600; text-decoration: none;
    border-bottom: 1.5px solid rgba(231,116,129,.6);
    padding-bottom: 2px;
    transition: color .18s ease, border-color .18s ease;
  }
  .intro-attrib a:hover { color: #E77481; border-bottom-color: #E77481; }
  .intro-attrib-sep { opacity: .35; }
  @media (max-width: 700px) {
    .intro-attrib { font-size: 14.5px; gap: 10px; }
  }

  /* ── Main CTA ─────────────────────────────────────────────────── */
  .intro-cta {
    position: relative; isolation: isolate;
    display: inline-flex; align-items: center; gap: 12px;
    background: linear-gradient(135deg,#E77481 0%,#d946ef 50%,#9B3FC7 100%);
    background-size: 200% 100%; background-position: 0% 50%;
    color: #fff;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 18px; font-weight: 700;
    text-decoration: none;
    padding: 20px 36px;
    border-radius: 16px;
    letter-spacing: -.01em;
    box-shadow:
      0 22px 50px -10px rgba(231,116,129,.45),
      0 8px 20px -6px rgba(155,63,199,.35),
      inset 0 1px 0 rgba(255,255,255,.18);
    transition: transform .22s cubic-bezier(.2,.8,.3,1), box-shadow .25s ease, background-position .8s ease;
    opacity: 0; transform: translateY(14px);
    animation: heroIn .9s cubic-bezier(.2,.8,.3,1) 1.25s forwards, ctaBob 4.6s ease-in-out 2s infinite;
  }
  .intro-cta:hover {
    transform: translateY(-3px);
    background-position: 100% 50%;
    box-shadow:
      0 30px 60px -10px rgba(231,116,129,.55),
      0 14px 28px -6px rgba(155,63,199,.45),
      inset 0 1px 0 rgba(255,255,255,.22);
  }
  .intro-cta svg { width: 20px; height: 20px; transition: transform .2s ease; }
  .intro-cta:hover svg { transform: translateX(5px); }
  /* Gentle vertical bob to make the button feel alive while the page
     idles before recording. Subtle so it doesn't feel busy. */
  @keyframes ctaBob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-4px); }
  }
  /* When the animation overrides the start-state translateY, the
     entry transform from heroIn would compete. After the entry
     completes we hand off to ctaBob so transform stays on origin. */
  @media (max-width: 700px) {
    .intro-cta { font-size: 16px; padding: 16px 28px; }
  }

  /* Sub-line under the CTA — a brief reassurance pill */
  .intro-cta-sub {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12.5px;
    color: rgba(255,255,255,.5);
    letter-spacing: .02em;
    display: inline-flex; align-items: center; gap: 10px;
    margin-top: -22px;
    opacity: 0;
    animation: heroIn 1s cubic-bezier(.2,.8,.3,1) 1.6s forwards;
  }
  .intro-cta-sub::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%;
    background: #22c55e; box-shadow: 0 0 10px rgba(34,197,94,.7);
    animation: pulseDot 2s ease-in-out infinite;
  }
  @keyframes pulseDot {
    0%,100% { opacity:.7; transform: scale(1); }
    50%     { opacity: 1; transform: scale(1.25); }
  }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    body::before, body::after,
    .intro-cta,
    .intro-quote,
    .intro-press,
    .intro-attrib,
    .intro-cta-sub,
    .intro-quote-wrap { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
</style>
</head>

<body>

<!-- Minimal nav — TaxReady wordmark + a small soft CTA. Avoids the full
     mega-menu so the page reads as a focused demo intro, not a normal
     site page. -->
<nav class="intro-nav">
  <a class="intro-nav-logo" href="/uk/" aria-label="TaxReady home">
    <img src="/assets/taxready.svg" alt="TaxReady">
  </a>
  <a class="intro-nav-cta" href="/uk/for-accountants/">Claim my profile &rarr;</a>
</nav>

<main class="intro-hero">

  <!-- Press eyebrow + XU logo. Logo sits on a white card so the WEBP
       full-colour mark reads clearly against the dark hero bg. -->
  <div class="intro-press">
    <span class="intro-eyebrow">As featured in</span>
    <a class="intro-xu-logo"
       href="https://xumagazine.com/news/56-million-taxpayers-overpaid-hmrc-last-year-a-new-free-tool-wants-to-send-them-straight-to-your-door"
       target="_blank" rel="noopener"
       aria-label="Read the XU Magazine article about TaxReady">
      <img src="/assets/xu-magazine-logo.webp" alt="XU Magazine">
    </a>
  </div>

  <!-- THE QUOTE — animated 4-stop gradient breathes pink ↔ magenta ↔
       purple across the text over 9s. Big Playfair italic so the
       editorial typography carries the visual weight without needing
       extra ornamentation. Outlined open/close quote marks sit on
       the wrapper as ::before/::after for newspaper feel. -->
  <div class="intro-quote-wrap">
    <h1 class="intro-quote">Warm, pre-qualified enquiries, at no cost, matched exclusively to your firm.</h1>
  </div>

  <div class="intro-attrib">
    <span>&mdash; <a href="https://xumagazine.com/news/56-million-taxpayers-overpaid-hmrc-last-year-a-new-free-tool-wants-to-send-them-straight-to-your-door" target="_blank" rel="noopener">XU Magazine</a></span>
    <span class="intro-attrib-sep">&middot;</span>
    <span>April 2026</span>
  </div>

  <a class="intro-cta" href="/uk/for-accountants/">
    Claim my free profile
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </a>

  <span class="intro-cta-sub">Live profile in 60 seconds &middot; free forever</span>

</main>

</body>
</html>
