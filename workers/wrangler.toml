name = "taxready-firms"
main = "src/index.js"
compatibility_date = "2024-09-23"

# After running `wrangler d1 create taxready-firms`, paste the printed
# database_id here.
[[d1_databases]]
binding = "DB"
database_name = "taxready-firms"
database_id = "a69d6232-b83b-404d-a9da-13e421a84287"

# Allow importing HTML template files as text strings in the Worker bundle.
[[rules]]
type = "Text"
globs = ["**/*-template.html"]
fallthrough = false

# Routes: intercept accounting-firm paths before GitHub Pages sees them.
# All other paths pass through to the GitHub Pages origin unchanged.

# Root domain — 301 to /uk/ for every visitor (US visitors see a banner on /uk/)
[[routes]]
pattern = "taxready.me/"
zone_name = "taxready.me"

[[routes]]
pattern = "taxready.me/index.html"
zone_name = "taxready.me"

# www → apex in a single hop. Only fires if the www DNS record is proxied
# (orange cloud) in Cloudflare.
[[routes]]
pattern = "www.taxready.me/*"
zone_name = "taxready.me"

# Legacy static pages — real 301s (LEGACY_301 in src/index.js) instead of the
# GitHub Pages "Redirecting…" stubs.
[[routes]]
pattern = "taxready.me/accountants"
zone_name = "taxready.me"

[[routes]]
pattern = "taxready.me/accountants.html"
zone_name = "taxready.me"

[[routes]]
pattern = "taxready.me/uk/accountants.html"
zone_name = "taxready.me"

[[routes]]
pattern = "taxready.me/find-accountant.html"
zone_name = "taxready.me"

# The map search moved to the country homes (/uk/, /us/) — 301 the old URLs.
[[routes]]
pattern = "taxready.me/uk/find-accountant*"
zone_name = "taxready.me"

[[routes]]
pattern = "taxready.me/us/find-accountant*"
zone_name = "taxready.me"

[[routes]]
pattern = "taxready.me/construction.html"
zone_name = "taxready.me"

[[routes]]
pattern = "taxready.me/creative.html"
zone_name = "taxready.me"

[[routes]]
pattern = "taxready.me/freelancer.html"
zone_name = "taxready.me"

[[routes]]
pattern = "taxready.me/healthcare.html"
zone_name = "taxready.me"

[[routes]]
pattern = "taxready.me/hospitality.html"
zone_name = "taxready.me"

[[routes]]
pattern = "taxready.me/landlord.html"
zone_name = "taxready.me"

[[routes]]
pattern = "taxready.me/retail.html"
zone_name = "taxready.me"

[[routes]]
pattern = "taxready.me/othersmallbusiness.html"
zone_name = "taxready.me"

[[routes]]
pattern = "taxready.me/uk/accounting-firms/*"
zone_name = "taxready.me"

# [[routes]]
# pattern = "taxready.me/au/accounting-firms/*"
# zone_name = "taxready.me"

[[routes]]
pattern = "taxready.me/us/accounting-firms/"
zone_name = "taxready.me"

[[routes]]
pattern = "taxready.me/us/accounting-firms/*"
zone_name = "taxready.me"

# Legacy paths (old GitHub Pages static files, pre-/uk/ migration).
# Worker 301s these to the canonical /uk/ equivalents.
[[routes]]
pattern = "taxready.me/accounting-firms/*"
zone_name = "taxready.me"

[[routes]]
pattern = "taxready.me/api/*"
zone_name = "taxready.me"
